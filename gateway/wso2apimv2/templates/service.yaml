apiVersion: v1
kind: Service
metadata:
  name: wso2am
spec:
  type: {{ .Values.service.type }}
  selector:
    app: wso2am
  ports:
    - port: 9443
      targetPort: 9443
      nodePort: {{ .Values.service.nodePorts.ui }}
    - port: 8243
      targetPort: 8243
      nodePort: {{ .Values.service.nodePorts.gatewayHttps }}
    - port: 8280
      targetPort: 8280
      nodePort: {{ .Values.service.nodePorts.gatewayHttp }}
