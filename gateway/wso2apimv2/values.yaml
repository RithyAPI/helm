replicaCount: 1

image:
  repository: wso2/wso2am
  tag: "4.4.0"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  nodePorts:
    ui: 30443
    gatewayHttps: 30243
    gatewayHttp: 30280

resources: {}

apim:
  config:
    enabled: true
    # This is where we inject the TOML content correctly
    configData: |
      [server]
      hostname = "192.168.8.22"         # 👈 Replace with your PUBLIC IP or DOMAIN
      node_ip = "192.168.8.22"          # 👈 Needed for NodePort
      base_path = "https://192.168.8.22:30443"  # 👈 Optional, helps on redirects
