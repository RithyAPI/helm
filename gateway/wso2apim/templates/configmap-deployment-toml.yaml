# wso2apim-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: wso2apim-config
data:
  deployment.toml: |
    [server]
    hostname = "192.168.8.22"
    node_ip = "127.0.0.1"
    server_role = "default"
    mode = "single"

    [user_store]
    type = "database"

    [database.shared_db]
    url = "jdbc:h2:./repository/database/WSO2SHARED_DB;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=60000"
    username = "wso2carbon"
    password = "wso2carbon"

    [database.apim_db]
    url = "jdbc:h2:./repository/database/WSO2AM_DB;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=60000"
    username = "wso2carbon"
    password = "wso2carbon"

    [database.user]
    url = "jdbc:h2:./repository/database/WSO2USER_DB;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=60000"
    username = "wso2carbon"
    password = "wso2carbon"

    [database.registry]
    url = "jdbc:h2:./repository/database/WSO2REG_DB;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=60000"
    username = "wso2carbon"
    password = "wso2carbon"
