apiVersion: apps/v1
kind: Deployment
metadata:
  name: wso2am
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: wso2am
  template:
    metadata:
      labels:
        app: wso2am
    spec:
      containers:
        - name: wso2am
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9443
            - containerPort: 9444
            - containerPort: 9445
          readinessProbe:
            httpGet:
              path: /services/Version
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 180
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /services/Version
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 180
            periodSeconds: 30
          resources:
{{ toYaml .Values.resources | indent 12 }}
