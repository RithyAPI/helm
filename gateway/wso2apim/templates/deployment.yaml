apiVersion: apps/v1
kind: Deployment
metadata:
  name: wso2am
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: wso2am
  template:
    metadata:
      labels:
        app: wso2am
    spec:
      containers:
        - name: wso2am
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9443  # Admin Portal
            - containerPort: 9444  # Publisher
            - containerPort: 9445  # Developer Portal
